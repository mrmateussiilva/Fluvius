name: Deploy Automático Fluvius

on:
  push:
    branches:
      - main

jobs:
  test:
    name: CI — Testes e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # --- Backend CI ---
      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Testes Backend (Pytest)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          uv run --with pytest --with pytest-asyncio pytest

      # --- Frontend CI ---
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar Dependências Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Testes Frontend (Vitest)
        run: |
          cd frontend
          pnpm run test

      - name: Validar Build Frontend
        run: |
          cd frontend
          pnpm run build

  deploy:
    name: Deploy em Produção
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e

            cd /opt/apps/fluvius

            echo "=== [1/4] Atualizando código ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/4] Rebuild das imagens ==="
            docker compose -f docker-compose-sistema.yml build --parallel backend frontend

            echo "=== [3/4] Reiniciando serviços ==="
            docker compose -f docker-compose-sistema.yml up -d backend frontend

            echo "=== [4/4] Limpeza de imagens antigas ==="
            docker image prune -f

            echo "✅ Deploy concluído com sucesso!"
