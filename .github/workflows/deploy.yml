name: Deploy Automático Fluvius

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Executar Testes e Validações (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # --- Backend CI ---
      - name: Configurar uv
        uses: astral-sh/setup-uv-action@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Executar Testes de Backend (Pytest)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          uv run --with pytest --with pytest-asyncio pytest

      # --- Frontend CI ---
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar Dependências do Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Executar Testes de Frontend (Vitest)
        run: |
          cd frontend
          pnpm run test

      - name: Validar Build do Frontend
        run: |
          cd frontend
          pnpm run build

  deploy:
    name: Deploy em Produção
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/apps/fluvius
            git pull origin main
            docker compose -f docker-compose-sistema.yml up -d --build backend frontend

